<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; }
  html,body { background:#0b0d1e; }
  .board {
    position:absolute; top:0; left:0;
    width:1080px; height:1350px; overflow:hidden;
    background:linear-gradient(180deg,#0b0d1e 0%, #141633 38%, #1b1d40 62%, #10122a 100%);
  }
  .hero {
    position:absolute; top:0; left:0; width:1080px; height:608px;
    background:url('cover.png') center/cover no-repeat;
  }
  .fade {
    position:absolute; top:428px; left:0; width:1080px; height:180px;
    background:linear-gradient(180deg, rgba(11,13,30,0) 0%, rgba(17,19,42,0.92) 78%, #111326 100%);
  }
  .goldline {
    position:absolute; top:668px; left:90px; width:900px;
    font:600 23px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing:4px; text-align:center;
    color:#e2c184; text-transform:uppercase;
  }
  .rule {
    position:absolute; top:716px; left:340px; width:400px; height:1px;
    background:linear-gradient(90deg, rgba(226,193,132,0), #e2c184 35%, #e2c184 65%, rgba(226,193,132,0));
  }
  .serif {
    position:absolute; top:750px; left:90px; width:900px; text-align:center;
    font:400 88px/1.15 'Didot','Bodoni 72','Playfair Display',Georgia,serif;
    color:#f4efe2;
  }
  .serif .amp { color:#e2c184; font-style:italic; }
  .sub {
    position:absolute; top:872px; left:60px; width:960px; text-align:center;
    font:400 26px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif;
    color:#b9b3d6; letter-spacing:0.5px;
  }
  .price {
    position:absolute; top:934px; left:120px; width:840px; text-align:center;
    font:600 30px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif;
    color:#f4efe2; letter-spacing:1px;
  }
  .cta {
    position:absolute; top:1006px; left:120px; width:840px; text-align:center;
    font:600 26px/1.4 -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing:5px; text-transform:uppercase; color:#e2c184;
  }
  .handle {
    position:absolute; top:1282px; left:0; width:1080px; text-align:center;
    font:400 22px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
    letter-spacing:3px; color:rgba(185,179,214,0.55);
  }
</style>
</head>
<body>
<div class="board">
  <div class="hero"></div>
  <div class="fade"></div>
  <div class="goldline">Saturday 19 December &nbsp;·&nbsp; 5 pm &nbsp;·&nbsp; Inner HUMM</div>
  <div class="rule"></div>
  <div class="serif">Lie back<span class="amp">.</span> Drift<span class="amp">.</span></div>
  <div class="sub">Live improvised piano &nbsp;·&nbsp; candlelit room &nbsp;·&nbsp; tea on arrival &nbsp;·&nbsp; 11 places</div>
  <div class="price">$35 early bird &nbsp;·&nbsp; $40</div>
  <div class="cta">Tickets — link in bio</div>
  <div class="handle">@daniele.buatti</div>
</div>
</body>
</html>
